name: Build Portable ZIP

on:
  workflow_dispatch:        # Cho phép bấm nút "Run workflow" thủ công
  push:
    branches:
      - claude/complete-task-nscb9
    paths:
      - 'VToolProMerge/**'
      - '.github/workflows/build-portable.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish self-contained (win-x64)
        shell: pwsh
        run: |
          dotnet publish VToolProMerge/VToolProMerge.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            /p:PublishSingleFile=false `
            /p:PublishReadyToRun=true `
            /p:DebugType=none /p:DebugSymbols=false `
            -o publish-portable

      - name: Zip output
        shell: pwsh
        run: |
          Compress-Archive -Path "publish-portable/*" `
                           -DestinationPath "VToolProMerge-Portable-2.1.0.0-win-x64.zip" `
                           -Force

      - name: Upload portable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: VToolProMerge-Portable
          path: VToolProMerge-Portable-2.1.0.0-win-x64.zip
          retention-days: 30
